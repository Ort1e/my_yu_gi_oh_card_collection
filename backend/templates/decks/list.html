{% extends "list_base.html" %}

{% block items %}
  {% if decks.is_empty() %}
    <p class="card-title">No deck.</p>
  {% else %}
    <div class="card-list">
      {% for deck in decks %}
      <a href="/decks/{{ deck.id }}" class="card-link">
        <div class="card">
          <div class="card-title">{{ deck.name }}</div>
          <div class="card-meta-line">
            <div>Description: {{ deck.description.as_deref().unwrap_or("") }}</div>
          </div>
        </div>
      </a>
      {% endfor %}
    </div>
  {% endif %}
{% endblock %}

{% block add_button %}
  <a href="/decks/add" title="Add deck" class="btn floating-button top">Add deck</a>
{% endblock %}
