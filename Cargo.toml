[workspace]
resolver = "2"
members = ["crates/*", "importer"]


[workspace.dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "set-header", "trace"] }
anyhow = "1.0.104"

# Server-rendered templates for the "simple pages"
askama = "0.12"
askama_axum = "0.4"

# SQLite access
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Pure domain crates (no DB, no HTTP), one per collection + what they share
common-domain = { path = "crates/common-domain" }
yugioh-domain = { path = "crates/yugioh-domain" }
books-domain = { path = "crates/books-domain" }
pokemon-domain = { path = "crates/pokemon-domain" }
regex = "1"
base64 = "0.22"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.8"
# lopdf rather than pdf-extract: pdf-extract println!s text fragments (personal data) to stdout
lopdf = "0.42"
url = "2"
html-escape = "0.2"
# session cookie signature (login)
hmac = "0.12"
sha2 = "0.10"
# Yugipedia's file paths (MediaWiki: md5 of the name)
md-5 = "0.10"
# the book scan, on the NAS: a phone photo decoded straight at 1/2, 1/4 or
# 1/8 of its size (`image` decodes it whole: 8 s and 300 MB for 50 MP on the
# NAS, 3 s and 60 MB this way), then its EAN-13 barcode read
jpeg-decoder = { version = "0.3", default-features = false }
rxing = { version = "0.9", default-features = false, features = ["oned", "decoders", "no_character_set_support"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# advent calendar photos: EXIF orientation, resize, re-encode without metadata
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# the public copy's card pictures as lossy WebP (libwebp, C, SSE2 only by
# default: fine for the NAS's old Atom); `image` only writes lossless WebP
webp = { version = "0.3", default-features = false }
