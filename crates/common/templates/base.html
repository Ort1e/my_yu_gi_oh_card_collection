<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Card Collection{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/form.css">
    <link rel="stylesheet" href="/static/css/books.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="container">
      <header class="site-header">
        <nav class="navbar">
          {% block nav %}
          {% include "partials/yugioh_nav.html" %}
          {% endblock %}
          <button type="button" class="nav-toggle" aria-controls="nav-links" aria-expanded="false" hidden>Menu</button>
        </nav>
      </header>

      {% block content %}{% endblock %}
    </div>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/back_link.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
