[package]
name = "yugioh"
version = "0.1.0"
edition = "2021"

# The Yu-Gi-Oh! collection: cards, lots, sellers, budget, decks (and the deck
# builder's JSON API), tournaments, ban lists, the collection value, the
# advent calendar, prices, and its maintenance commands.

[features]
# the test fixtures (`testing`), for the backend's cross-collection tests
test-support = ["common/test-support"]

[dependencies]
common = { path = "../common" }
advent = { path = "../advent" }
common-domain = { workspace = true }
yugioh-domain = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
askama = { workspace = true }
askama_axum = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }

[dev-dependencies]
common = { path = "../common", features = ["test-support"] }
tower = { workspace = true, features = ["util"] }
rust_decimal_macros = { workspace = true }
