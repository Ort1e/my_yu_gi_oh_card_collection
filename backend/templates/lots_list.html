{% extends "list_base.html" %}

{% block items %}
  {% if lots.is_empty() %}
    <p class="card-title">No lot.</p>
  {% else %}
    <div class="card-list">
      {% for lot in lots %}
        {% include "_lot_item.html" %}
      {% endfor %}
    </div>
  {% endif %}
{% endblock %}

{% block filter %}
<button id="filter-badge" class="filter-badge">Filter</button>
<div id="filter-modal" class="filter-modal hidden">
  <div class="filter-content">
    <h2>Filter lots</h2>
    <form method="get">
      <label for="seller_name">seller name:</label>
      <input type="text" name="seller_name" id="seller_name" value="{{ filter.seller_name.as_deref().unwrap_or("") }}" placeholder="Seller name">
      <label for="sold">Sold:</label>
      <select name="sold" id="sold">
        <option value="" {% if self.sold_is("") %}selected{% endif %}>All lots</option>
        <option value="true" {% if self.sold_is("true") %}selected{% endif %}>Only sold</option>
        <option value="false" {% if self.sold_is("false") %}selected{% endif %}>Only purchased</option>
      </select>
      <div style="margin-top: 1rem;">
        <button type="submit">Apply</button>
        <a href="/lots" class="reset-button" style="margin-left: 0.5rem;">Reset</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block add_button %}
  <a href="/lots/add" title="Add lot" class="btn filter-badge" style="top: 70px; bottom: auto;">Add lot</a>
{% endblock %}
