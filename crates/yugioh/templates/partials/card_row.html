{# One card row of a lot form. Needs `i` (row index) and `row` (CardRowValues). #}
<fieldset class="card-row">
  <legend>Card {% if remove_button %}<button type="button" class="remove-row btn-small btn-danger" title="Remove this card">✕</button>{% endif %}</legend>

  <div class="field-row">
    <div class="wide">
      <label for="cards-{{ i }}-name">Name:</label>
      <input type="text" name="cards-{{ i }}-name" id="cards-{{ i }}-name" value="{{ row.name }}" maxlength="255">
    </div>
    <div class="wide">
      <label for="cards-{{ i }}-en_name">English name:</label>
      <input type="text" name="cards-{{ i }}-en_name" id="cards-{{ i }}-en_name" value="{{ row.en_name }}" maxlength="255" placeholder="defaults to the name">
    </div>
    <label class="switch"><input type="checkbox" name="cards-{{ i }}-is_proxy" {% if row.is_proxy %}checked{% endif %}> Proxy</label>
  </div>

  <div class="field-row">
    <div>
      <label for="cards-{{ i }}-code">Code:</label>
      <input type="text" name="cards-{{ i }}-code" id="cards-{{ i }}-code" value="{{ row.code }}" maxlength="20">
    </div>
    <div>
      <label for="cards-{{ i }}-status">Status:</label>
      <select name="cards-{{ i }}-status" id="cards-{{ i }}-status">
        <option value="">---------</option>
        {% for status in self.statuses() %}
        <option value="{{ status.code() }}" {% if row.status == status.code() %}selected{% endif %}>{{ status.label() }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="cards-{{ i }}-rarity">Rarity:</label>
      <select name="cards-{{ i }}-rarity" id="cards-{{ i }}-rarity">
        <option value="">---------</option>
        {% for rarity in self.rarities() %}
        <option value="{{ rarity.label() }}" {% if row.rarity == rarity.label() %}selected{% endif %}>{{ rarity.label() }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="cards-{{ i }}-price">Price:</label>
      <input type="text" inputmode="decimal" name="cards-{{ i }}-price" id="cards-{{ i }}-price" value="{{ row.price }}">
    </div>
    <div>
      <label for="cards-{{ i }}-quantity">Quantity:</label>
      <input type="number" min="1" max="100" name="cards-{{ i }}-quantity" id="cards-{{ i }}-quantity" value="{{ row.quantity }}" placeholder="1">
    </div>
  </div>
</fieldset>
