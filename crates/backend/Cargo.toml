[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# The app's binary: the web server (every collection, assembled by
# `common::app`) and the maintenance commands.

[dependencies]
common = { path = "../common" }
yugioh = { path = "../yugioh" }
books = { path = "../books" }
pokemon = { path = "../pokemon" }

axum = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
common = { path = "../common", features = ["test-support"] }
yugioh = { path = "../yugioh", features = ["test-support"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
