{% extends "base.html" %}

{% block title %}Edit {{ card.name }}{% endblock %}

{% block content %}
<div class="inside-container narrow">
<h1>Edit Card</h1>
<p class="back-link"><a href="/cards/{{ id }}">← Back to the card</a></p>

{% include "partials/form_errors.html" %}

<form method="post" action="/cards/{{ id }}/edit">
  <fieldset>
    <legend>Card</legend>
    <p>
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" value="{{ card.name }}" maxlength="255" required>
    </p>
    <p>
      <label for="en_name">English name:</label>
      <input type="text" name="en_name" id="en_name" value="{{ card.en_name }}" maxlength="255" placeholder="defaults to the name">
      <small>Changing it relinks the card to its card data.</small>
    </p>
    <p>
      <label for="code">Code:</label>
      <input type="text" name="code" id="code" value="{{ card.code }}" maxlength="20">
    </p>
    <p>
      <label for="status">Last known status:</label>
      <select name="status" id="status">
        <option value="">---------</option>
        {% for status in self.statuses() %}
        <option value="{{ status.code() }}" {% if card.status == status.code() %}selected{% endif %}>{{ status.label() }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      <label for="rarity">Rarity:</label>
      <select name="rarity" id="rarity">
        <option value="">---------</option>
        {% for rarity in self.rarities() %}
        <option value="{{ rarity.label() }}" {% if card.rarity == rarity.label() %}selected{% endif %}>{{ rarity.label() }}</option>
        {% endfor %}
      </select>
      <small><a href="/rarities" target="_blank">How to recognise a rarity</a></small>
    </p>
    <label class="switch"><input type="checkbox" name="is_proxy" {% if card.is_proxy %}checked{% endif %}> Proxy card</label>
  </fieldset>

  <input type="submit" value="Save">
</form>
</div>
{% endblock %}
