{% extends "list_base.html" %}

{% block items %}
  {% if cards.is_empty() %}
    <p class="card-title">No card.</p>
  {% else %}
    <div class="card-list">
      {% for card in cards %}
        {% include "partials/card_item.html" %}
      {% endfor %}
    </div>
  {% endif %}
{% endblock %}

{% block filter %}
<button id="filter-badge" class="floating-button">Filter</button>
<div id="filter-modal" class="filter-modal hidden">
  <div class="filter-content">
    <form method="get">
      <h2>Filter cards</h2>
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" value="{{ filter.name.as_deref().unwrap_or("") }}" placeholder="Card name">

      <label for="code">Code:</label>
      <input type="text" name="code" id="code" value="{{ filter.code.as_deref().unwrap_or("") }}" placeholder="Card code">

      <label for="status">Status:</label>
      <select name="status" id="status">
        <option value="" {% if self.selected(filter.status, "") %}selected{% endif %}>All</option>
        {% for status in domain::card::CardStatus::ALL %}
        <option value="{{ status.code() }}" {% if self.selected(filter.status, status.code()) %}selected{% endif %}>{{ status.code() }}</option>
        {% endfor %}
      </select>

      <label for="card_type">Card Type:</label>
      <select name="card_type" id="card_type">
        <option value="" {% if self.selected(filter.card_type, "") %}selected{% endif %}>All types</option>
        {% for card_type in card_types %}
        <option value="{{ card_type }}" {% if self.selected(filter.card_type, card_type) %}selected{% endif %}>{{ card_type }}</option>
        {% endfor %}
      </select>

      <label for="proxy">Proxy:</label>
      <select name="proxy" id="proxy">
        <option value="" {% if self.selected(filter.proxy, "") %}selected{% endif %}>All cards</option>
        <option value="true" {% if self.selected(filter.proxy, "true") %}selected{% endif %}>Only proxy</option>
        <option value="false" {% if self.selected(filter.proxy, "false") %}selected{% endif %}>No proxy</option>
      </select>

      <label for="sold">Sold:</label>
      <select name="sold" id="sold">
        <option value="" {% if self.selected(filter.sold, "") %}selected{% endif %}>All cards</option>
        <option value="true" {% if self.selected(filter.sold, "true") %}selected{% endif %}>Only sold</option>
        <option value="false" {% if self.selected(filter.sold, "false") %}selected{% endif %}>Not sold</option>
      </select>

      <div class="button-row">
        <button type="submit">Apply</button>
        <a href="/cards" class="btn btn-secondary">Reset</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
