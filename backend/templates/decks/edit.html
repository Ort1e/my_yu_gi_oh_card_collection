{% extends "base.html" %}

{% block title %}Edit {{ name }}{% endblock %}

{% block content %}
<div class="inside-container narrow">
<h1>Edit Deck</h1>
<p class="back-link"><a href="/decks/{{ id }}">← Back to the deck</a></p>

{% include "partials/form_errors.html" %}

<form method="post" action="/decks/{{ id }}/edit">
  <fieldset>
    <legend>Deck Information</legend>
    <p>
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" value="{{ name }}" maxlength="100" required>
    </p>
    <p>
      <label for="description">Description:</label>
      <textarea name="description" id="description" rows="4">{{ description }}</textarea>
    </p>
  </fieldset>

  <input type="submit" value="Save">
</form>
</div>
{% endblock %}
